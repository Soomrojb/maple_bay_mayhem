# Maple Bay Mayhem settings (also editable in-game: Options)
sensitivity=1.00
invert_y=0
volume=8
music=5
fov=75
fullscreen=1
show_fps=0
# key bindings: bind.<action>=<primary>,<secondary>  (X11 keysym names, MouseN, or none)
bind.forward=w,Up
bind.back=s,Down
bind.left=a,Left
bind.right=d,Right
bind.jump=space,none
bind.sprint=Shift_L,none
bind.interact=e,none
bind.kick=f,none
bind.fire=Mouse1,v
bind.aim=Mouse3,x
bind.reload=r,none
bind.next_weapon=q,Mouse4
bind.prev_weapon=z,Mouse5
bind.handbrake=space,Control_L
bind.horn=h,Mouse3
bind.callcar=c,none
bind.resetcar=r,none
bind.ascend=space,none
bind.descend=Control_L,none
bind.missile=g,Mouse3
bind.cam_left=j,none
bind.cam_right=l,none
bind.cam_up=i,none
bind.cam_down=k,none
bind.map=m,Tab
bind.pause=p,none
